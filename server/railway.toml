[build]
builder = "NIXPACKS"

[deploy]
# Migrations run in nixpacks.toml [phases.build] (pre-prune, while tsx is
# still installed). Start phase stays minimal so devDeps can be omitted.
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
