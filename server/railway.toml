[build]
builder = "NIXPACKS"

[deploy]
# Migrations run at boot via tsx (now a regular dep, so it survives any
# devDep pruning). The migration script is idempotent (CREATE TABLE IF
# NOT EXISTS + DROP/ADD constraint), so running it on every boot is safe.
startCommand = "npm run migrate && node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
