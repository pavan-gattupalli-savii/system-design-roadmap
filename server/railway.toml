[build]
builder = "NIXPACKS"

[deploy]
# Migrations are idempotent (IF NOT EXISTS), so it's safe to run on every
# boot. Prepending here avoids a missed-migration crash window after deploys
# that add new tables. tsx is bundled via devDeps (see nixpacks.toml).
startCommand = "npm run migrate && node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
